<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable | LumiSkin</title>
<meta http-equiv="refresh" content="3;url=https://masques-led-visage.fr">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --gold:#B8922A; --cream:#FDFAF4; --text:#2C2416; --text-muted:#9A8A6E; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--cream); color:var(--text); font-family:'DM Sans',sans-serif; font-weight:300; min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:2rem; }
  .wrap { max-width:500px; }
  .num { font-family:'Cormorant Garamond',serif; font-size:8rem; color:var(--gold); opacity:0.2; line-height:1; margin-bottom:1rem; }
  h1 { font-family:'Cormorant Garamond',serif; font-size:2rem; font-weight:300; margin-bottom:1rem; }
  h1 em { font-style:italic; color:var(--gold); }
  p { color:var(--text-muted); font-size:0.9rem; line-height:1.8; margin-bottom:2rem; }
  .links { display:flex; flex-direction:column; gap:0.8rem; }
  a { color:var(--gold); text-decoration:none; font-size:0.85rem; letter-spacing:0.08em; transition:opacity 0.3s; }
  a:hover { opacity:0.7; }
  .btn { display:inline-block; background:var(--gold); color:#fff; padding:0.85rem 2rem; border-radius:3px; font-size:0.78rem; letter-spacing:0.1em; text-transform:uppercase; margin-top:1rem; }
  .btn:hover { opacity:0.85; }

  


  /* NAV REFAIT */
  nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1.1rem 4rem;background:rgba(253,250,244,0.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--border-soft);}
  nav ul{display:flex;gap:2rem;list-style:none;margin:0;padding:0;}
  nav ul li{margin:0;padding:0;}
  nav ul a{color:var(--text-muted);text-decoration:none;font-size:0.74rem;letter-spacing:0.14em;text-transform:uppercase;transition:color 0.3s;padding-bottom:2px;}
  nav ul a:hover{color:var(--gold);}
  nav ul a.nav-active{color:var(--gold);border-bottom:1px solid var(--gold);}
  .nav-mobile-btn{display:none;background:none;border:none;font-size:1.4rem;color:var(--text);cursor:pointer;padding:0.3rem;}
  .nav-mobile-menu{display:none;position:fixed;top:64px;left:0;right:0;background:rgba(253,250,244,0.98);backdrop-filter:blur(12px);padding:0;border-bottom:1px solid var(--border-soft);z-index:99;list-style:none;margin:0;}
  .nav-mobile-menu.open{display:block;}
  .nav-mobile-menu li{margin:0;padding:0;border-bottom:1px solid var(--border-soft);}
  .nav-mobile-menu a{display:block;padding:1rem 2rem;font-size:0.8rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-muted);text-decoration:none;transition:all 0.2s;}
  .nav-mobile-menu a:hover{color:var(--gold);background:var(--gold-wash);}
  .nav-mobile-menu a.nav-active{color:var(--gold);}
  @media(max-width:900px){
    nav{padding:1rem 1.5rem;}
    nav ul{display:none !important;}
    .nav-mobile-btn{display:block;}
  }

</style>
<script>
  // Smart redirect based on URL
  const url = window.location.pathname;
  if (url.includes('inia') && url.includes('shark')) {
    window.location.replace('https://masques-led-visage.fr/comparatif.html');
  } else if (url.includes('avant') || url.includes('apres') || url.includes('resultat')) {
    window.location.replace('https://masques-led-visage.fr/resultats.html');
  } else if (url.includes('choisir') || url.includes('guide')) {
    window.location.replace('https://masques-led-visage.fr/guide.html');
  } else if (url.includes('blog')) {
    window.location.replace('https://masques-led-visage.fr/blog.html');
  } else {
    setTimeout(() => window.location.replace('https://masques-led-visage.fr'), 3000);
  }
</script>
</head>
<body>
  <div class="wrap">
    <div class="num">404</div>
    <h1>Page <em>introuvable</em></h1>
    <p>Cette page a été déplacée ou n'existe plus. Vous allez être redirigé automatiquement vers la bonne page dans 3 secondes.</p>
    <div class="links">
      <a href="/">🏠 Page principale</a>
      <a href="/blog.html">📖 Tous nos articles</a>
      <a href="/comparatif.html">⚖️ INIA vs Shark CryoGlow</a>
      <a href="/resultats.html">✨ Résultats avant/après</a>
      <a href="/guide.html">📋 Guide d'achat</a>
    </div>
    <a href="/" class="btn">Retour à l'accueil</a>
  </div>
</body>
</html>
